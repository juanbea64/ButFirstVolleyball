<!DOCTYPE html>
<html lang="es" xmlns="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Jugadores de Voleibol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Voleibol Manager</span>
        </div>
    </nav>

    <div class="container mt-5">
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <h1 class="text-center mb-5">Listado de Jugadores de Voleibol</h1>

        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Edad</th>
                        <th>Raza</th>
                        <th>Color</th>
                        <th>Posición</th>
                        <th>Altura (m)</th>
                        <th>Peso (kg)</th>
                        <th>Equipo</th>
                        <th>Número Camiseta</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="itemJugador : ${jugadorVoley}">
                        <td><span class="badge bg-primary" th:text="${itemJugador.jugadorID}"></span></td>
                        <td th:text="${itemJugador.nombreJugador}"></td>
                        <td th:text="${itemJugador.edadJugador}"></td>
                        <td th:text="${itemJugador.raza}"></td>
                        <td th:text="${itemJugador.color}"></td>
                        <td><span class="badge bg-info" th:text="${itemJugador.posicion}"></span></td>
                        <td th:text="${itemJugador.altura}"></td>
                        <td th:text="${itemJugador.peso}"></td>
                        <td th:text="${itemJugador.equipo}"></td>
                        <td><span class="badge bg-success" th:text="${itemJugador.numeroCamiseta}"></span></td>
                        <td>
                            <a th:href="@{'/editar/' + ${itemJugador.jugadorID}}" class="btn btn-sm btn-warning"><i class="fas fa-edit"></i> Editar</a>
                            <a th:href="@{'/eliminar/' + ${itemJugador.jugadorID}}" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i> Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="text-center mt-4">
            <a href="/nuevo" class="btn btn-primary btn-lg me-2"><i class="fas fa-plus"></i> Agregar Jugador</a>
            <button class="btn btn-secondary btn-lg"><i class="fas fa-download"></i> Descargar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
