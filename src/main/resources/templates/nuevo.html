<!DOCTYPE html>
<html lang="es" xmlns="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Nuevo Jugador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Voleibol Manager</span>
        </div>
    </nav>

    <div class="container mt-5">
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0" th:text="${jugadorVoley.jugadorID != null ? 'Editar Jugador' : 'Agregar Nuevo Jugador'}"></h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/guardar}" method="POST" th:object="${jugadorVoley}">
                            
                            <div class="mb-3">
                                <label for="nombreJugador" class="form-label">Nombre del Jugador</label>
                                <input type="text" class="form-control" id="nombreJugador" 
                                       th:field="*{nombreJugador}" placeholder="Ej: Juan Pérez" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="edadJugador" class="form-label">Edad</label>
                                        <input type="number" class="form-control" id="edadJugador" 
                                               th:field="*{edadJugador}" placeholder="Ej: 25" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="raza" class="form-label">Raza</label>
                                        <input type="text" class="form-control" id="raza" 
                                               th:field="*{raza}" placeholder="Ej: Latinoamericano">
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="color" class="form-label">Color</label>
                                        <input type="color" class="form-control form-control-color" id="color" 
                                               th:field="*{color}" value="#000000">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="posicion" class="form-label">Posición</label>
                                        <select class="form-select" id="posicion" th:field="*{posicion}" required>
                                            <option value="">Selecciona una posición</option>
                                            <option value="Líbero">Líbero</option>
                                            <option value="Opuesto">Opuesto</option>
                                            <option value="Central">Central</option>
                                            <option value="Colocador">Colocador</option>
                                            <option value="Banda">Banda</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="altura" class="form-label">Altura (m)</label>
                                        <input type="number" step="0.01" class="form-control" id="altura" 
                                               th:field="*{altura}" placeholder="Ej: 1.85" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="peso" class="form-label">Peso (kg)</label>
                                        <input type="number" step="0.1" class="form-control" id="peso" 
                                               th:field="*{peso}" placeholder="Ej: 78.5" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="equipo" class="form-label">Equipo</label>
                                        <input type="text" class="form-control" id="equipo" 
                                               th:field="*{equipo}" placeholder="Ej: Águilas Voleibol" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="numeroCamiseta" class="form-label">Número de Camiseta</label>
                                        <input type="number" class="form-control" id="numeroCamiseta" 
                                               th:field="*{numeroCamiseta}" placeholder="Ej: 7" required>
                                    </div>
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <input type="hidden" th:field="*{jugadorID}">
                                <a href="/" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-save"></i> Guardar Jugador
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
